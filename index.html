<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="referrer" content="no-referrer">
<title>Цаг бүртгэл</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin:0; height:100%; background:#0f172a; color:#f1f5f9;
               font-family:Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #msg { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
         text-align:center; padding:24px; box-sizing:border-box; gap:14px; }
  #msg img { width:96px; height:96px; border-radius:22px; }
  #msg h1 { margin:0; font-size:24px; }
  #msg p { margin:0; font-size:17px; color:#94a3b8; max-width:420px; line-height:1.45; }
  #install { display:none; font:inherit; font-size:20px; padding:14px 26px; border:0; border-radius:14px;
             background:#16a34a; color:#fff; }
  #hint { display:none; }
</style>
</head>
<body>
<div id="msg">
  <img src="icon-192.png" alt="">
  <h1>ХӨХ ТУГ ЭМИЙН САН<br>Цаг бүртгэл</h1>
  <p id="text">Эзнээс авсан QR кодыг уншуулж нээнэ үү.</p>
  <button id="install">📲 Апп болгож суулгах</button>
  <p id="hint">Суулгах товч гарахгүй бол: баруун дээд ⋮ → <b>«Апп суулгах»</b> эсвэл <b>«Нүүр дэлгэцэнд нэмэх»</b>.</p>
</div>
<script>
// QR дахь холбоос: <энэ хуудас>#u=<Apps Script-ийн …/exec?k=… холбоос>.
// «#»-ийн ард байгаа хэсэг сервер рүү илгээгдэхгүй — түлхүүр зөвхөн утсанд хадгалагдана.
const KEY = 'tsag_exec_url';
const VALID = /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec\?k=[\w-]+$/;
const $ = id => document.getElementById(id);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function load() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function save(u) { try { localStorage.setItem(KEY, u); } catch (e) {} }

let url = load();
const m = location.hash.match(/[#&]u=([^&]+)/);
if (m) {
  const u = decodeURIComponent(m[1]);
  if (VALID.test(u)) { url = u; save(u); }
  history.replaceState(null, '', location.pathname + location.search);
}

let deferred = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferred = e;
  $('install').style.display = 'inline-block';
  $('hint').style.display = 'none';
});
$('install').onclick = async () => {
  if (!deferred) return;
  deferred.prompt();
  await deferred.userChoice;
  deferred = null;
  $('install').style.display = 'none';
};
window.addEventListener('appinstalled', () => {
  $('text').textContent = 'Суулгалаа! Одоо нүүр дэлгэц дээрх «Цаг бүртгэл» дүрсээр нээнэ үү.';
  $('install').style.display = 'none';
  $('hint').style.display = 'none';
});

// Google-д нэвтэрсэн хөтөч Apps Script-ийг iframe-д харуулахгүй тул шууд шилжинэ.
// Суулгасан апп дотор шилжсэн хуудас мөн апп-ын цонхонд нээгдэнэ.
if (url && standalone) {
  $('text').textContent = 'Нээж байна…';
  location.replace(url);
} else if (url) {
  // Хөтчөөр нээсэн: эхлээд суулгуулна, хүсвэл шууд ашиглаж болно
  $('text').innerHTML = 'Холбоос хадгалагдлаа ✓<br>Одоо утсанд <b>апп болгож суулгана</b> уу.';
  $('hint').style.display = 'block';
  const go = document.createElement('p');
  go.innerHTML = '<a style="color:#60a5fa">Суулгалгүйгээр шууд нээх</a>';
  go.querySelector('a').href = url;
  $('msg').appendChild(go);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
